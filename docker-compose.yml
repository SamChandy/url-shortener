# `docker compose up` starts the API, PostgreSQL and Redis with no extra steps:
# no .env file is required (every setting has a development default below).
# For anything beyond your own machine, copy .env.example to .env and set real values.
name: url-shortener

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shortener}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shortener}
      POSTGRES_DB: ${POSTGRES_DB:-shortener}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to your machine on purpose. To inspect it with a SQL client, uncomment:
    # ports: ["5432:5432"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Cache + counters only: nothing here needs to survive a restart.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-5000}:5000"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-shortener}:${POSTGRES_PASSWORD:-shortener}@db:5432/${POSTGRES_DB:-shortener}
      REDIS_URL: redis://redis:6379/0
      # Empty = the container generates a temporary key (and warns). Set it in .env for real use.
      SECRET_KEY: ${SECRET_KEY:-}
      BASE_URL: ${BASE_URL:-http://localhost:5000}
      BLOCKED_HOSTS: ${BLOCKED_HOSTS:-localhost,127.0.0.1}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      SHORT_CODE_LENGTH: ${SHORT_CODE_LENGTH:-7}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-3600}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-20}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-0}
      GEOIP_DB_PATH: ${GEOIP_DB_PATH:-data/GeoLite2-Country.mmdb}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
    volumes:
      # Optional: put GeoLite2-Country.mmdb in ./data to get real countries.
      - ./data:/app/data:ro

  # ---- optional extras (not started by a plain `docker compose up`) ----

  # docker compose --profile dashboard up -d      -> http://localhost:8501
  dashboard:
    profiles: ["dashboard"]
    build: ./dashboard
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:5000
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"

  # Used by benchmark.bat:  docker compose --profile bench run --rm locust
  locust:
    profiles: ["bench"]
    image: locustio/locust:2.32.0   # if this tag is not found, use "latest"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./locustfile.py:/mnt/locust/locustfile.py:ro
      - ./benchmark_results:/results
    command: >
      -f /mnt/locust/locustfile.py --headless --only-summary
      --host http://api:5000
      -u ${LOCUST_USERS:-50} -r ${LOCUST_SPAWN_RATE:-10} -t ${LOCUST_DURATION:-30s}
      --csv /results/${BENCH_LABEL:-run}

volumes:
  pgdata:
