name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests (SQLite + fake Redis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  test-postgres:
    name: Tests + migrations (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://test:test@localhost:5432/test
      TEST_DATABASE_URL: postgresql+psycopg2://test:test@localhost:5432/test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-secret-key-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      # The migration must build the schema from nothing, undo it, and rebuild it.
      - run: alembic upgrade head
      - run: alembic downgrade base
      - run: alembic upgrade head
      - run: alembic downgrade base
      # Same test-suite, now against real PostgreSQL (covers the PostgreSQL-specific SQL).
      - run: python -m pytest
